[project]
name = "experimentkit"
version = "0.1.0"
description = "Capture at the bench: slate, ingest, sync and QC for experiment recordings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# An orchestrator: it pulls the strings and leaves the heavy lifting to the
# libraries. See README.md, "Where it sits".
dependencies = [
    # The record: project paths, dataset sidecars, schema checks. Zero
    # dependencies of its own.
    "projectkit",

    # Frame sources over video files and image sequences. Reading frames is
    # heavy lifting, so it comes from here rather than being written again.
    "markertracker",

    # Decoding the slate's QR codes. Capped below 5 for the same reason
    # markertracker is: OpenCV 5 removed APIs the calibration code relies on.
    "opencv-python>=4.8,<5",
    "numpy>=1.24",
]

[project.scripts]
experimentkit = "experimentkit.__main__:main"

[dependency-groups]
# matplotlib is optional at run time (storage plots are skipped without it),
# but the tests draw those plots.
dev = ["pytest>=8", "matplotlib>=3.7"]

[tool.uv.sources]
# projectkit is a sibling repository, resolved by relative path: uv fails loudly
# if it is missing rather than quietly installing something else.
projectkit = { path = "../Tool-ProjectManager", editable = true }
# markertracker comes from GitHub, pinned to a commit: its clone's folder name
# differs between computers (GUI-TrackAnything on parker-desktop), so a sibling
# path broke the lock there (2026-10-19). To pick up a newer TrackAnything,
# change rev and run `uv lock`.
markertracker = { git = "https://github.com/Xu-Lab-CU-Boulder/Tool-TrackAnything.git", rev = "a934ab51b5fbca59435b199fc0894e6eff2b8c1d" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["experimentkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
